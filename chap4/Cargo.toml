[package]
name = "async-rust-ch04"
version = "0.1.0"
edition = "2021"

[dependencies]
# hyper = { version = "0.14.26", features = ["http1", "http2", "client", "runtime"] }
hyper = { version = "1.7", features = ["http1", "http2", "client"] }
hyper-util = { version = "0.1.17", features = ["tokio"] }
http-body-util = { version = "0.1" }
# smol = "1.3.0"
smol = "2.0.2"
# anyhow = "1.0.70"
anyhow = "1"
async-native-tls = "0.5.0"
# http = "0.2.9"
http = "1.3.1"
# tokio = "1.14.0"
tokio = "1"
# mio = { version = "1.0.2", features = ["net", "os-poll"] }
mio = { version = "1", features = ["net", "os-poll"] }
# async-task = "4.4.0"
async-task = "4"
# futures-lite = "1.12.0"
futures-lite = "2"
# flume = "0.10.14"
flume = "0.11"
bytes = "1.10.1"
